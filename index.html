<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>용돈 관리 앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // Muted pastel accents
            brand: {
              blue: "#7690D8",
              mint: "#7BBEAE",
              peach: "#DDB292",
              rose: "#D59AA7",
              butter: "#DCCB96",
              sky: "#EDF3FB"
            }
          },
          fontFamily: {
            sans: ["Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "sans-serif"],
            hand: ["Gaegu", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --paper: #fffdf7;
      --paper-ink: #0f172a;
      --paper-line: rgba(15, 23, 42, 0.06);
      --paper-line-strong: rgba(15, 23, 42, 0.09);
      --paper-shadow: rgba(15, 23, 42, 0.06);
    }
    body { background: var(--paper); color: var(--paper-ink); font-weight: 500; }
    body.dark {
      --paper: #0b1220;
      --paper-ink: #e2e8f0;
      --paper-line: rgba(226, 232, 240, 0.07);
      --paper-line-strong: rgba(226, 232, 240, 0.10);
      --paper-shadow: rgba(0, 0, 0, 0.25);
      background: var(--paper);
      color: var(--paper-ink);
    }

    /* Light graph-paper texture */
    .paper-bg{
      background-image:
        linear-gradient(to right, var(--paper-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px),
        linear-gradient(to right, var(--paper-line-strong) 1px, transparent 1px),
        linear-gradient(to bottom, var(--paper-line-strong) 1px, transparent 1px);
      background-size: 18px 18px, 18px 18px, 90px 90px, 90px 90px;
      background-position: 0 0, 0 0, 0 0, 0 0;
    }

    /* Card: feels like paper cells (thin border, no heavy shadows) */
    .paper-card{
      background-color: rgba(255, 255, 255, 0.97);
      background-image: none;
      box-shadow: 0 1px 0 var(--paper-shadow);
    }
    body.dark .paper-card{
      background-color: rgba(17, 24, 39, 0.92);
      background-image: none;
      box-shadow: 0 1px 0 var(--paper-shadow);
    }

    .cozy-title{ font-family: Gaegu, Pretendard, sans-serif; letter-spacing: 0.2px; font-weight: 700; }
    .cozy-note{ font-family: Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif; font-weight: 600; }
    .speech-bubble{
      position: relative;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-weight: 500;
      line-height: 1.55;
    }
    body.dark .speech-bubble{
      background: rgba(17, 24, 39, 0.95);
      border-color: #475569;
    }
    .speech-bubble::after{
      content: "";
      position: absolute;
      right: -9px;
      bottom: 28px;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 10px solid #e5e7eb;
    }
    body.dark .speech-bubble::after{ border-left-color: #475569; }
    .speech-bubble::before{
      content: "";
      position: absolute;
      right: -7px;
      bottom: 29px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 9px solid rgba(255, 255, 255, 0.97);
    }
    body.dark .speech-bubble::before{ border-left-color: rgba(17, 24, 39, 0.95); }
    .mobile-shell { max-width: 480px; margin: 0 auto; }
    .tab-bar-shadow { box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08); }
    .safe-bottom { padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }
    @keyframes fish-shake {
      0% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-1px) rotate(-2deg); }
      50% { transform: translateX(1px) rotate(2deg); }
      75% { transform: translateX(-1px) rotate(-1deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }
    @keyframes boom-pop {
      0% { transform: scale(0.85); opacity: 0.7; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.95; }
    }
    .fish-shake { animation: fish-shake 0.28s infinite; transform-origin: 50% 50%; }
    .boom-pop { animation: boom-pop 0.45s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const APP_NAMESPACE = "allowance-manager-v4";
    const LEGACY_KEY = "pocket-money-manager-v1";
    const QUICK_AMOUNTS = [5000, 10000, 50000, 100000];
    // Muted pastel tones
    const COLOR_POOL = ["#D7A1AD", "#DAB59D", "#DCCB96", "#84BFAF", "#8EB9D3", "#7D92C8", "#B5ABC9", "#D7B3C9", "#A8B3C7"];

    const DEFAULT_EXPENSE_CATEGORIES = [
      { id: "exp-food", name: "식비", type: "expense", color: "#D7A1AD" },
      { id: "exp-transport", name: "교통", type: "expense", color: "#7D92C8" },
      { id: "exp-fun", name: "여가", type: "expense", color: "#DCCB96" },
      { id: "exp-shopping", name: "쇼핑", type: "expense", color: "#D7B3C9" },
      { id: "exp-etc", name: "기타", type: "expense", color: "#A8B3C7" }
    ];
    const DEFAULT_INCOME_CATEGORIES = [
      { id: "inc-allowance", name: "용돈", type: "income", color: "#84BFAF" },
      { id: "inc-parttime", name: "알바", type: "income", color: "#8EB9D3" },
      { id: "inc-bonus", name: "보너스", type: "income", color: "#B5ABC9" },
      { id: "inc-etc", name: "기타", type: "income", color: "#A8B3C7" }
    ];

    function getFishSpeechMessage({ ratio, pace, runaway }) {
      // Budget-driven (higher priority)
      if (ratio > 1) return "펑-! 내가 폭탄 된다고 했잖아. 이번 달 남은 날은 손가락만 빨고 살아야겠네.. 💣";
      if (ratio > 0.8) return "나 지금 목 매달리기 직전이야. 네 통장도 나만큼 숨 가쁘게 헐떡이는 중인데... 제발 멈춰!";
      if (ratio > 0.5) return "어라, 줄이 왜 올라가지...?  방금 긁은 거 진짜 꼭 필요했던 거 맞아?";

      // Trend-driven (only when calm: ≤ 50%)
      if (runaway) {
        return "지난달 전체 지출액을 벌써 따라잡으려고 해?! 이 속도 추이면 나 진짜 조만간 폭탄으로 터져, 내 목숨이 위험하다고! 💣";
      }
      if (pace === "slower") {
        return "오... 지난달 이맘때랑 비교해보니까 지출 그래프가 훨씬 완만해. 덕분에 나도 숨통이 좀 트인다, 아주 잘하고 있어! ✨";
      }
      if (pace === "faster") {
        return "잠깐만, 지출 추이가 이상한데? 지난달 이맘때보다 훨씬 가파르게 쓰고 있어! 너 이번 달 유독 고삐 풀린 것 같아. 제발 멈춰...!";
      }

      // Default calm
      return "아직은 줄이 넉넉해서 나도 편해. 이대로만 유지하자, 인간다운 삶 가능! ✨";
    }

    const pad = (n) => String(n).padStart(2, "0");
    const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
    const isMonth = (v) => /^\d{4}-\d{2}$/.test(v || "");
    const nowMonth = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    };
    const formatKRW = (v) => new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 }).format(v || 0);
    const monthToLabel = (m) => `${m.slice(0, 4)}년 ${Number(m.slice(5, 7))}월`;
    const monthCompare = (a, b) => a.localeCompare(b);
    const shiftMonth = (m, diff) => {
      const [y, mm] = m.split("-").map(Number);
      const d = new Date(y, mm - 1 + diff, 1);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    };
    const daysInMonth = (m) => {
      const [y, mm] = m.split("-").map(Number);
      return new Date(y, mm, 0).getDate();
    };
    const MONTH_INDEX_KEY = `${APP_NAMESPACE}:month-index`;
    const monthStorageKey = (month) => `${APP_NAMESPACE}:${month}`;

    function createDefaultMonthData(month) {
      const categories = [...DEFAULT_EXPENSE_CATEGORIES, ...DEFAULT_INCOME_CATEGORIES];
      const budgets = {};
      categories.filter((c) => c.type === "expense").forEach((c) => {
        budgets[c.id] = 0;
      });
      return {
        version: 4,
        month,
        asset: 0,
        categories,
        budgets,
        entries: []
      };
    }

    function normalizeMonthData(month, raw) {
      const base = createDefaultMonthData(month);
      if (!raw || typeof raw !== "object") return base;

      const categories = Array.isArray(raw.categories)
        ? raw.categories
            .filter((c) => c && c.id && c.name && (c.type === "expense" || c.type === "income"))
            .map((c, idx) => ({
              id: String(c.id),
              name: String(c.name).trim(),
              type: c.type,
              color: /^#([A-Fa-f0-9]{6})$/.test(c.color || "") ? c.color : COLOR_POOL[idx % COLOR_POOL.length]
            }))
            .filter((c) => c.name.length > 0)
        : base.categories;

      const categoryMap = Object.fromEntries(categories.map((c) => [c.id, c]));
      const budgets = {};
      categories.filter((c) => c.type === "expense").forEach((c) => {
        const n = Math.floor(Number(raw.budgets?.[c.id]) || 0);
        budgets[c.id] = n > 0 ? n : 0;
      });

      const entries = Array.isArray(raw.entries)
        ? raw.entries
            .filter((e) => e && (e.type === "expense" || e.type === "income"))
            .map((e) => {
              const date = String(e.date || "").slice(0, 10);
              const entryMonth = date.slice(0, 7);
              if (!isMonth(entryMonth) || entryMonth !== month) return null;
              const type = e.type;
              let categoryId = String(e.categoryId || "");
              if (!categoryMap[categoryId] || categoryMap[categoryId].type !== type) {
                const fallback = categories.find((c) => c.type === type && c.name === "기타") || categories.find((c) => c.type === type);
                categoryId = fallback?.id || "";
              }
              const amount = Math.floor(Number(e.amount) || 0);
              if (!categoryId || amount <= 0) return null;
              return {
                id: String(e.id || uid()),
                type,
                categoryId,
                amount,
                date,
                memo: String(e.memo || "")
              };
            })
            .filter(Boolean)
        : [];

      return {
        version: 4,
        month,
        asset: Math.max(0, Math.floor(Number(raw.asset) || 0)),
        categories,
        budgets,
        entries
      };
    }

    function readMonthIndex() {
      try {
        const raw = JSON.parse(localStorage.getItem(MONTH_INDEX_KEY) || "[]");
        return Array.isArray(raw) ? raw.filter((m) => isMonth(m)).sort() : [];
      } catch {
        return [];
      }
    }

    function updateMonthIndex(month) {
      if (!isMonth(month)) return;
      const index = readMonthIndex();
      if (index.includes(month)) return;
      localStorage.setItem(MONTH_INDEX_KEY, JSON.stringify([...index, month].sort()));
    }

    function loadMonthData(month) {
      if (!isMonth(month)) return createDefaultMonthData(nowMonth());
      try {
        const raw = localStorage.getItem(monthStorageKey(month));
        return normalizeMonthData(month, raw ? JSON.parse(raw) : null);
      } catch {
        return createDefaultMonthData(month);
      }
    }

    function saveMonthData(month, data) {
      const normalized = normalizeMonthData(month, data);
      localStorage.setItem(monthStorageKey(month), JSON.stringify(normalized));
      updateMonthIndex(month);
    }

    function migrateFromV3IfNeeded() {
      const doneKey = `${APP_NAMESPACE}:v3-migrated`;
      if (localStorage.getItem(doneKey) === "1") return;
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith("allowance-manager-v3:")) continue;
          const month = key.replace("allowance-manager-v3:", "");
          if (!isMonth(month)) continue;
          const raw = localStorage.getItem(key);
          if (raw) saveMonthData(month, JSON.parse(raw));
        }
      } catch {
      } finally {
        localStorage.setItem(doneKey, "1");
      }
    }

    function migrateLegacyIfNeeded() {
      const doneKey = `${APP_NAMESPACE}:legacy-migrated`;
      if (localStorage.getItem(doneKey) === "1") return;
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (!raw) {
          localStorage.setItem(doneKey, "1");
          return;
        }
        const legacy = JSON.parse(raw);
        const txs = Array.isArray(legacy.transactions) ? legacy.transactions : [];
        const bucket = {};

        txs.forEach((t) => {
          const date = String(t?.date || "").slice(0, 10);
          const month = date.slice(0, 7);
          const type = t?.type === "income" ? "income" : "expense";
          if (!isMonth(month) || !date) return;
          if (!bucket[month]) bucket[month] = loadMonthData(month);
          const data = bucket[month];

          let category = data.categories.find((c) => c.type === type && c.name === String(t?.category || "기타"));
          if (!category) {
            category = {
              id: `${type}-${uid()}`,
              name: String(t?.category || "기타"),
              type,
              color: COLOR_POOL[data.categories.length % COLOR_POOL.length]
            };
            data.categories.push(category);
            if (type === "expense") data.budgets[category.id] = 0;
          }

          const amount = Math.max(0, Math.floor(Number(t?.amount) || 0));
          if (amount <= 0) return;
          data.entries.push({
            id: String(t?.id || uid()),
            type,
            categoryId: category.id,
            amount,
            date,
            memo: String(t?.memo || "")
          });
        });

        Object.keys(bucket).forEach((m) => saveMonthData(m, bucket[m]));
      } catch {
      } finally {
        localStorage.setItem(doneKey, "1");
      }
    }

    function buildCalendarCells(month) {
      const [y, m] = month.split("-").map(Number);
      const first = new Date(y, m - 1, 1);
      const lastDate = new Date(y, m, 0).getDate();
      const leading = (first.getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < leading; i++) cells.push(null);
      for (let d = 1; d <= lastDate; d++) cells.push(`${y}-${pad(m)}-${pad(d)}`);
      return cells;
    }

    function computeExpenseStats(entries) {
      const amountMap = {};
      const countMap = {};
      entries.forEach((e) => {
        if (e.type !== "expense") return;
        amountMap[e.categoryId] = (amountMap[e.categoryId] || 0) + e.amount;
        countMap[e.categoryId] = (countMap[e.categoryId] || 0) + 1;
      });
      return { amountMap, countMap };
    }

    function computeSpendingPace(currentMonth, currentExpense, lastMonthExpense) {
      if (lastMonthExpense <= 0) return "none";
      const today = new Date();
      const isCurrentMonth = currentMonth === nowMonth();
      const elapsedDays = isCurrentMonth ? today.getDate() : daysInMonth(currentMonth);
      const lastDays = daysInMonth(shiftMonth(currentMonth, -1));
      const currentDaily = currentExpense / Math.max(elapsedDays, 1);
      const lastDaily = lastMonthExpense / Math.max(lastDays, 1);
      if (currentDaily > lastDaily * 1.05) return "faster";
      if (currentDaily < lastDaily * 0.95) return "slower";
      return "similar";
    }

    function buildTrendRows(currentStats, lastStats, categories) {
      return categories.map((cat) => {
        const current = currentStats.amountMap[cat.id] || 0;
        const last = lastStats.amountMap[cat.id] || 0;
        const diff = current - last;
        const pct = last > 0 ? Math.round((diff / last) * 100) : (current > 0 ? 100 : 0);
        return {
          ...cat,
          current,
          last,
          diff,
          pct,
          currentCount: currentStats.countMap[cat.id] || 0,
          lastCount: lastStats.countMap[cat.id] || 0
        };
      });
    }

    function DonutChart({ labels, values, colors, dark, compact }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) {
          chartRef.current.destroy();
          chartRef.current = null;
        }
        const total = values.reduce((a, b) => a + b, 0);
        if (total <= 0) return;

        chartRef.current = new Chart(canvasRef.current, {
          type: "doughnut",
          data: {
            labels,
            datasets: [{
              data: values,
              backgroundColor: colors,
              borderWidth: 2,
              borderColor: dark ? "#0f172a" : "#ffffff"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "62%",
            plugins: {
              legend: {
                position: "bottom",
                labels: {
                  color: dark ? "#e2e8f0" : "#334155",
                  boxWidth: 12,
                  padding: 14
                }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const val = ctx.raw || 0;
                    const pct = total > 0 ? Math.round((val / total) * 100) : 0;
                    return ` ${ctx.label}: ${formatKRW(val)} (${pct}%)`;
                  }
                }
              }
            }
          }
        });

        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [labels, values, colors, dark]);

      const total = values.reduce((a, b) => a + b, 0);
      if (total <= 0) {
        return (
          <div className={`${compact ? "h-full min-h-[10rem]" : "h-64"} flex items-center justify-center rounded-xl border ${dark ? "border-slate-700 bg-slate-800/50 text-slate-400" : "border-slate-200 bg-slate-50 text-slate-500"}`}>
            이번 달 지출 데이터가 없습니다.
          </div>
        );
      }

      return (
        <div className={`${compact ? "h-full" : "h-72"} relative`}>
          <canvas ref={canvasRef} />
        </div>
      );
    }

    function DateDetailModal({ openDate, entries, categories, onClose, dark, onEditEntry, onDeleteEntry }) {
      if (!openDate) return null;
      const categoryMap = Object.fromEntries(categories.map((c) => [c.id, c]));
      const sorted = entries.slice().sort((a, b) => (a.id < b.id ? 1 : -1));
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 p-4 flex items-end sm:items-center justify-center" onClick={onClose}>
          <div className={`w-full max-w-xl rounded-2xl border p-5 ${dark ? "bg-slate-900 border-slate-700 text-slate-100" : "bg-white border-slate-100 text-slate-900"}`} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold">{openDate} 상세 내역</h3>
              <button onClick={onClose} className={`px-3 py-1 text-sm rounded-lg ${dark ? "bg-slate-800" : "bg-slate-100"}`}>닫기</button>
            </div>
            <div className="space-y-2 max-h-[70vh] overflow-y-auto">
              {sorted.length === 0 ? (
                <p className={`text-sm ${dark ? "text-slate-400" : "text-slate-500"}`}>선택한 날짜의 기록이 없습니다.</p>
              ) : sorted.map((e) => {
                const cat = categoryMap[e.categoryId];
                return (
                  <div key={e.id} className={`rounded-xl border p-3 ${dark ? "border-slate-700 bg-slate-800" : "border-slate-100 bg-slate-50/80"}`}>
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 text-sm">
                        <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: cat?.color || "#94A3B8" }} />
                        <strong>{cat?.name || "알 수 없는 카테고리"}</strong>
                        <span className={`text-[11px] px-2 py-0.5 rounded ${e.type === "expense" ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}>
                          {e.type === "expense" ? "지출" : "수입"}
                        </span>
                      </div>
                      <div className="flex items-center gap-2">
                        <strong>{e.type === "expense" ? "-" : "+"}{formatKRW(e.amount)}</strong>
                        <button
                          type="button"
                          onClick={() => onEditEntry?.(e)}
                          className={`px-2 py-1 text-xs rounded-lg border ${dark ? "border-slate-600 bg-slate-700/60 text-slate-100" : "border-gray-300 bg-white text-slate-700"}`}
                        >
                          수정
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteEntry?.(e.id)}
                          className="px-2 py-1 text-xs rounded-lg border border-rose-300 bg-rose-50 text-rose-700"
                        >
                          삭제
                        </button>
                      </div>
                    </div>

          </div>

    function BudgetUrgencySticker({ ratio, dark }) {
      const stage = ratio > 1 ? "boom" : ratio > 0.8 ? "panic" : ratio > 0.5 ? "alert" : "calm";
      const ropeHeight = stage === "calm" ? 68 : stage === "alert" ? 46 : stage === "panic" ? 24 : 16;
      const face = stage === "calm"
        ? { eyeR: 2.1, sweat: false, panicLines: false }
        : stage === "alert"
          ? { eyeR: 2.3, sweat: true, panicLines: false }
          : { eyeR: 2.5, sweat: true, panicLines: true };

      return (
        <div className={`w-[168px] h-[130px] shrink-0 rounded-2xl border relative overflow-hidden ${dark ? "bg-slate-900/80 border-slate-700" : "bg-[#fffefb] border-gray-200"}`}>
          <svg width="168" height="130" viewBox="0 0 168 130">
            <line x1="84" y1="2" x2="84" y2={ropeHeight} stroke={dark ? "#94a3b8" : "#64748b"} strokeWidth="2" strokeLinecap="round" />
            {stage !== "boom" ? (
              <g className={stage === "panic" ? "fish-shake" : ""} transform={`translate(42 ${ropeHeight - 4})`}>
                <path d="M8 34 C2 30, 0 22, 4 15 C9 10, 16 8, 22 12 C24 18, 22 26, 16 32 C12 36, 9 35, 8 34 Z" fill="#9CCFEA" stroke={dark ? "#64748b" : "#7b879a"} strokeWidth="1.6" strokeLinejoin="round" />
                <path d="M24 14 C30 8, 44 5, 58 9 C66 12, 70 18, 68 25 C64 32, 50 36, 36 33 C28 30, 24 22, 24 14 Z" fill="#A9D8F3" stroke={dark ? "#64748b" : "#7b879a"} strokeWidth="1.7" strokeLinejoin="round" />
                <path d="M62 18 C70 15, 78 14, 86 16 C80 21, 78 27, 84 31 C76 30, 68 27, 62 22 Z" fill="#8FC8EB" stroke={dark ? "#64748b" : "#7b879a"} strokeWidth="1.5" strokeLinejoin="round" />
                <ellipse cx="36" cy="20" rx="2.8" ry="2.2" fill="#1f2937" />
                {face.sweat && (
                  <path d="M52 10 C55 5, 58 9, 56 14 C54 16, 51 14, 52 10 Z" fill="#9fc7d9" stroke="#85afc2" strokeWidth="0.8" />
                )}
                {face.panicLines && (
                  <>
                    <line x1="28" y1="8" x2="28" y2="14" stroke="#5FA6D8" strokeWidth="1.5" strokeLinecap="round" />
                    <line x1="34" y1="7" x2="34" y2="14" stroke="#5FA6D8" strokeWidth="1.5" strokeLinecap="round" />
                    <line x1="40" y1="8" x2="40" y2="14" stroke="#5FA6D8" strokeWidth="1.5" strokeLinecap="round" />
                  </>
                )}
              </g>
            ) : (
              <g className="boom-pop" transform="translate(48 18)">
                <ellipse cx="36" cy="52" rx="20" ry="14" fill={dark ? "#64748b" : "#cbd5e1"} opacity="0.55" />
                <ellipse cx="52" cy="44" rx="12" ry="9" fill={dark ? "#64748b" : "#cbd5e1"} opacity="0.45" />
                <ellipse cx="68" cy="50" rx="14" ry="10" fill={dark ? "#64748b" : "#cbd5e1"} opacity="0.4" />
                <path d="M30 30 C40 28, 48 34, 48 44 C48 52, 40 58, 30 58 C20 58, 12 50, 12 40 C12 30, 20 30, 30 30 Z" fill="#4b5563" stroke="#1f2937" strokeWidth="1.7" />
                <path d="M30 30 C27 22, 34 20, 36 27" stroke="#d6a96d" strokeWidth="2.4" strokeLinecap="round" />
                <circle cx="24" cy="42" r="2.4" fill="#f1f5f9" />
                <circle cx="36" cy="47" r="2.4" fill="#f1f5f9" />
                <path d="M24 52 Q30 55 36 52" stroke="#f1f5f9" strokeWidth="1.6" fill="none" />
                <text x="58" y="38" fontSize="15" fontWeight="800" fill={dark ? "#fca5a5" : "#e8799a"} fontFamily="Pretendard, sans-serif">BOOM</text>
              </g>
            )}
          </svg>
        </div>
      );
    }

    function BudgetPreviewChips({ categories, currentStats, monthDataBudgets, max = 3 }) {
      const items = categories
        .map((cat) => {
          const spent = currentStats.amountMap[cat.id] || 0;
          const budget = monthDataBudgets[cat.id] || 0;
          const pct = budget > 0 ? Math.round((spent / budget) * 100) : null;
          return { cat, spent, budget, pct };
        })
        .filter((x) => x.spent > 0 || x.budget > 0)
        .sort((a, b) => b.spent - a.spent)
        .slice(0, max);

      if (!items.length) {
        return <p className="text-xs text-slate-400">아직 지출·예산 데이터가 없습니다.</p>;
      }

      return (
        <div className="flex flex-wrap gap-1.5">
          {items.map(({ cat, pct, budget, spent }) => (
            <span
              key={cat.id}
              className="inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
            >
              <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cat.color }} />
              {cat.name}
              {budget > 0 ? ` ${Math.min(pct, 999)}%` : spent > 0 ? ` ${formatKRW(spent)}` : ""}
            </span>
          ))}
        </div>
      );
    }

    function BudgetProgressBar({ cat, spent, count, budget, onBudgetChange, dark, inputClass, compact }) {
      const pct = budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : (spent > 0 ? 100 : 0);
      const over = budget > 0 && spent > budget;
      return (
        <div className={`rounded-xl border ${compact ? "p-2" : "p-3"} ${dark ? "border-slate-700 bg-slate-800/50" : "border-slate-100 bg-slate-50/80"}`}>
          <div className="flex items-center justify-between mb-1">
            <div className="flex items-center gap-2 text-sm font-semibold">
              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cat.color }} />
              {cat.name}

            <span className={`text-xs ${dark ? "text-slate-400" : "text-slate-500"}`}>(총 {count}회)</span>
          </div>
          <div className="flex items-center justify-between text-xs mb-1.5 gap-2 min-w-0">
            <span className="min-w-0 break-all leading-tight">{formatKRW(spent)} / {budget > 0 ? formatKRW(budget) : "미설정"}</span>
            <span className={`shrink-0 ${over ? "text-red-500 font-bold" : "text-emerald-600 font-bold"}`}>{budget > 0 ? `${pct}%` : "-"}</span>
          </div>
          <div className={`h-1.5 rounded-full overflow-hidden ${dark ? "bg-slate-700" : "bg-slate-200"}`}>
            <div
              className={`h-full rounded-full transition-all ${over ? "bg-red-500" : "bg-brand-blue"}`}
              style={{ width: `${budget > 0 ? Math.min(100, pct) : (spent > 0 ? 100 : 0)}%` }}
            />
          </div>
          {!compact && (
            <input
              type="number"
              placeholder="예산 상한 입력"
              value={budget || ""}
              onChange={(e) => onBudgetChange(cat.id, e.target.value)}

            />
          )}
        </div>
      );

    function TrendCompareChart({ trendRows, dark, cardClass }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const rows = trendRows.filter((r) => r.current > 0 || r.last > 0);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) {
          chartRef.current.destroy();
          chartRef.current = null;
        }
        if (!rows.length) return;

        chartRef.current = new Chart(canvasRef.current, {
          type: "bar",
          data: {
            labels: rows.map((r) => r.name),
            datasets: [
              {
                label: "지난달",
                data: rows.map((r) => r.last),
                backgroundColor: dark ? "rgba(148,163,184,0.7)" : "rgba(148,163,184,0.6)",
                borderRadius: 6
              },
              {
                label: "이번달",
                data: rows.map((r) => r.current),
                backgroundColor: dark ? "rgba(59,130,246,0.8)" : "rgba(37,99,235,0.75)",
                borderRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: { color: dark ? "#cbd5e1" : "#475569" },
                grid: { display: false }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: dark ? "#cbd5e1" : "#475569",
                  callback: (v) => Number(v).toLocaleString("ko-KR")
                },
                grid: {
                  color: dark ? "rgba(148,163,184,0.25)" : "rgba(148,163,184,0.2)"
                }
              }
            },
            plugins: {
              legend: {
                labels: { color: dark ? "#e2e8f0" : "#334155" }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.dataset.label}: ${formatKRW(ctx.raw || 0)}`
                }
              }
            }
          }
        });

        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [dark, rows]);

      return (
        <div className={`rounded-2xl border p-4 ${cardClass}`}>
          <h2 className="font-semibold mb-3">카테고리 지난달 대비 비교 그래프</h2>

    function App() {
      migrateFromV3IfNeeded();
      migrateLegacyIfNeeded();
      const currentMonth = nowMonth();
      const [viewMode, setViewMode] = useState("mobile");
      const [activeTab, setActiveTab] = useState("home");
      const [cursorMonth, setCursorMonth] = useState(currentMonth);
      const [monthData, setMonthData] = useState(() => loadMonthData(currentMonth));
      const [lastMonthData, setLastMonthData] = useState(() => loadMonthData(shiftMonth(currentMonth, -1)));
      const [theme, setTheme] = useState("light");
      const [entryType, setEntryType] = useState("expense");
      const [selectedCategoryId, setSelectedCategoryId] = useState("");
      const [amount, setAmount] = useState("");
      const [entryDate, setEntryDate] = useState(`${currentMonth}-${pad(new Date().getDate())}`);
      const [memo, setMemo] = useState("");
      const [newCategoryName, setNewCategoryName] = useState("");
      const [newCategoryType, setNewCategoryType] = useState("expense");
      const [newCategoryColor, setNewCategoryColor] = useState("#3B82F6");
      const [openDate, setOpenDate] = useState(null);
      const [entryEditDraft, setEntryEditDraft] = useState(null);
      const [budgetOpen, setBudgetOpen] = useState(false);
      const [categoryOpen, setCategoryOpen] = useState(false);
      const [budgetPanelOpen, setBudgetPanelOpen] = useState(false);
      const [categoryPanelOpen, setCategoryPanelOpen] = useState(false);

      const dark = theme === "dark";
      const isMobileView = viewMode === "mobile";

      useEffect(() => {
        if (isMobileView && activeTab === "input") setActiveTab("home");
      }, [isMobileView, activeTab]);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
        document.body.classList.toggle("dark", dark);
      }, [dark]);

      useEffect(() => {
        const loaded = loadMonthData(cursorMonth);
        setMonthData(loaded);
        setLastMonthData(loadMonthData(shiftMonth(cursorMonth, -1)));
        setEntryDate(`${cursorMonth}-${pad(Math.min(new Date().getDate(), daysInMonth(cursorMonth)))}`);
        setOpenDate(null);
      }, [cursorMonth]);

      useEffect(() => {
        saveMonthData(cursorMonth, monthData);
      }, [cursorMonth, monthData]);

      const categoryMap = useMemo(
        () => Object.fromEntries(monthData.categories.map((c) => [c.id, c])),
        [monthData.categories]
      );

      const categoriesByType = useMemo(
        () => ({
          expense: monthData.categories.filter((c) => c.type === "expense"),
          income: monthData.categories.filter((c) => c.type === "income")
        }),
        [monthData.categories]
      );

      useEffect(() => {
        const list = categoriesByType[entryType];
        if (!list.length) {
          setSelectedCategoryId("");
          return;
        }
        if (!list.find((cat) => cat.id === selectedCategoryId)) {
          setSelectedCategoryId(list[0].id);
        }
      }, [entryType, categoriesByType, selectedCategoryId]);

      const entriesByDate = useMemo(() => {
        const map = {};
        monthData.entries.forEach((e) => {
          if (!map[e.date]) map[e.date] = [];
          map[e.date].push(e);
        });
        return map;
      }, [monthData.entries]);

      const currentStats = useMemo(() => computeExpenseStats(monthData.entries), [monthData.entries]);
      const lastStats = useMemo(() => computeExpenseStats(lastMonthData.entries), [lastMonthData.entries]);

      const monthIncome = useMemo(
        () => monthData.entries.filter((e) => e.type === "income").reduce((sum, e) => sum + e.amount, 0),
        [monthData.entries]
      );
      const monthExpense = useMemo(
        () => monthData.entries.filter((e) => e.type === "expense").reduce((sum, e) => sum + e.amount, 0),
        [monthData.entries]
      );
      const lastMonthExpense = useMemo(
        () => lastMonthData.entries.filter((e) => e.type === "expense").reduce((sum, e) => sum + e.amount, 0),
        [lastMonthData.entries]
      );

      const trendRows = useMemo(
        () => buildTrendRows(currentStats, lastStats, categoriesByType.expense),
        [currentStats, lastStats, categoriesByType.expense]
      );

      const donutLabels = useMemo(
        () => categoriesByType.expense.filter((c) => (currentStats.amountMap[c.id] || 0) > 0).map((c) => c.name),
        [categoriesByType.expense, currentStats.amountMap]
      );
      const donutValues = useMemo(
        () => categoriesByType.expense.filter((c) => (currentStats.amountMap[c.id] || 0) > 0).map((c) => currentStats.amountMap[c.id]),
        [categoriesByType.expense, currentStats.amountMap]
      );
      const donutColors = useMemo(
        () => categoriesByType.expense.filter((c) => (currentStats.amountMap[c.id] || 0) > 0).map((c) => c.color),
        [categoriesByType.expense, currentStats.amountMap]
      );

      const budgetSummary = useMemo(() => {
        const expenseCats = categoriesByType.expense;
        const overCount = expenseCats.filter((c) => {
          const budget = monthData.budgets[c.id] || 0;
          const spent = currentStats.amountMap[c.id] || 0;
          return budget > 0 && spent > budget;
        }).length;
        return `${expenseCats.length}개 카테고리${overCount > 0 ? ` · ${overCount}개 예산 초과` : ""}`;
      }, [categoriesByType.expense, monthData.budgets, currentStats.amountMap]);

      const categorySummary = useMemo(() => {
        return `지출 ${categoriesByType.expense.length}개 · 수입 ${categoriesByType.income.length}개`;
      }, [categoriesByType.expense.length, categoriesByType.income.length]);

      const urgencyInfo = useMemo(() => {
        const expenseCats = categoriesByType.expense;
        const ratios = expenseCats
          .map((cat) => {
            const budget = monthData.budgets[cat.id] || 0;
            const spent = currentStats.amountMap[cat.id] || 0;
            return budget > 0 ? spent / budget : 0;
          })
          .filter((r) => Number.isFinite(r));
        const ratio = ratios.length ? Math.max(...ratios) : 0;
        const pace = computeSpendingPace(cursorMonth, monthExpense, lastMonthExpense);
        const dayOfMonth = Number(String(entryDate).slice(8, 10)) || 1;
        const endBufferDay = Math.max(daysInMonth(cursorMonth) - 3, 1);
        const runaway = lastMonthExpense > 0 && monthExpense >= lastMonthExpense && dayOfMonth <= endBufferDay;
        return { ratio, message: getFishSpeechMessage({ ratio, pace, runaway }) };
      }, [
        categoriesByType.expense,
        monthData.budgets,
        currentStats.amountMap,
        cursorMonth,
        monthExpense,
        lastMonthExpense,
        entryDate
      ]);

      const addEntry = (ev) => {
        ev.preventDefault();
        const n = Number(String(amount).replace(/[^\d]/g, ""));
        if (!n || !selectedCategoryId) return;
        if (!entryDate.startsWith(cursorMonth)) return;
        setMonthData((prev) => ({
          ...prev,
          entries: [{ id: uid(), type: entryType, categoryId: selectedCategoryId, amount: n, date: entryDate, memo: memo.trim() }, ...prev.entries]
        }));
        setAmount("");
        setMemo("");
      };

      const addQuickAmount = (plus) => {
        const base = Number(String(amount).replace(/[^\d]/g, "")) || 0;
        setAmount(String(base + plus));
      };

      const openEntryEdit = (entry) => {
        if (!entry) return;
        setEntryEditDraft({
          id: entry.id,
          type: entry.type,
          categoryId: entry.categoryId,
          amount: String(entry.amount || ""),
          date: entry.date,
          memo: entry.memo || ""
        });
      };

      const updateEntryDraft = (patch) => {
        setEntryEditDraft((prev) => {
          if (!prev) return prev;
          const next = { ...prev, ...patch };
          if (patch.type && patch.type !== prev.type) {
            const fallback = categoriesByType[patch.type]?.[0];
            next.categoryId = fallback?.id || "";
          }
          return next;
        });
      };

      const saveEntryEdit = () => {
        if (!entryEditDraft) return;
        const n = Number(String(entryEditDraft.amount).replace(/[^\d]/g, ""));
        if (!n || !entryEditDraft.categoryId || !entryEditDraft.date?.startsWith(cursorMonth)) return;
        setMonthData((prev) => ({
          ...prev,
          entries: prev.entries.map((e) => e.id === entryEditDraft.id ? {
            ...e,
            type: entryEditDraft.type,
            categoryId: entryEditDraft.categoryId,
            amount: n,
            date: entryEditDraft.date,
            memo: entryEditDraft.memo.trim()
          } : e)
        }));
        setEntryEditDraft(null);
      };

      const deleteEntry = (entryId) => {
        if (!entryId) return;
        if (!window.confirm("이 내역을 삭제할까요?")) return;
        setMonthData((prev) => ({
          ...prev,
          entries: prev.entries.filter((e) => e.id !== entryId)
        }));
        setEntryEditDraft((prev) => (prev?.id === entryId ? null : prev));
      };

      const addCategory = () => {
        const cleanName = newCategoryName.trim();
        if (!cleanName) return;
        const duplicated = monthData.categories.some((c) => c.type === newCategoryType && c.name === cleanName);
        if (duplicated) return;
        const nextCat = { id: `${newCategoryType}-${uid()}`, name: cleanName, type: newCategoryType, color: newCategoryColor };
        setMonthData((prev) => {
          const next = { ...prev, categories: [...prev.categories, nextCat], budgets: { ...prev.budgets } };
          if (nextCat.type === "expense") next.budgets[nextCat.id] = 0;
          return next;
        });
        setNewCategoryName("");
        if (newCategoryType === entryType) setSelectedCategoryId(nextCat.id);
      };

      const deleteCategory = (catId) => {
        const target = monthData.categories.find((c) => c.id === catId);
        if (!target) return;
        const sameType = monthData.categories.filter((c) => c.type === target.type);
        if (sameType.length <= 1) return;
        const fallback = sameType.find((c) => c.id !== catId);
        setMonthData((prev) => {
          const nextEntries = prev.entries.map((e) => (e.categoryId === catId ? { ...e, categoryId: fallback.id } : e));
          const nextCategories = prev.categories.filter((c) => c.id !== catId);
          const nextBudgets = { ...prev.budgets };
          delete nextBudgets[catId];
          return { ...prev, categories: nextCategories, budgets: nextBudgets, entries: nextEntries };
        });
      };

      const updateCategoryColor = (catId, color) => {
        setMonthData((prev) => ({
          ...prev,
          categories: prev.categories.map((c) => (c.id === catId ? { ...c, color } : c))
        }));
      };

      const updateBudget = (catId, value) => {
        const n = Math.max(0, Math.floor(Number(value) || 0));
        setMonthData((prev) => ({ ...prev, budgets: { ...prev.budgets, [catId]: n } }));
      };

      const goPrevMonth = () => setCursorMonth(shiftMonth(cursorMonth, -1));
      const goNextMonth = () => setCursorMonth(shiftMonth(cursorMonth, 1));

      const card = dark
        ? "paper-card border border-slate-700 text-slate-100"
        : "paper-card border border-gray-200 text-slate-900";
      const input = dark
        ? "bg-slate-900/40 border-slate-700 text-slate-100"
        : "bg-[#fffefb] border-gray-200 text-slate-900";
      const subtle = dark ? "text-slate-400" : "text-slate-500";
      const shellClass = isMobileView ? "mobile-shell" : "max-w-[1400px] mx-auto w-full";
      const contentPad = isMobileView ? "safe-bottom" : "pb-8";

      const categoryManagerInner = (
        <CategoryManager
          monthData={monthData}
          dark={dark}
          inputClass={input}
          onAdd={addCategory}
          onDelete={deleteCategory}
          onColorChange={updateCategoryColor}
          newCategoryName={newCategoryName}
          setNewCategoryName={setNewCategoryName}
          newCategoryType={newCategoryType}
          setNewCategoryType={setNewCategoryType}
          newCategoryColor={newCategoryColor}
          setNewCategoryColor={setNewCategoryColor}
          compact={true}
        />
      );

      const entryFormBlock = (
        <EntryForm
          entryType={entryType}
          setEntryType={setEntryType}
          amount={amount}
          setAmount={setAmount}
          addQuickAmount={addQuickAmount}
          selectedCategoryId={selectedCategoryId}
          setSelectedCategoryId={setSelectedCategoryId}
          categoriesByType={categoriesByType}
          entryDate={entryDate}
          setEntryDate={setEntryDate}
          memo={memo}
          setMemo={setMemo}
          onSubmit={addEntry}
          dark={dark}
          inputClass={input}
          cardClass={card}
          wide={!isMobileView}
          embedded={false}
        />
      );

      const entryFormEmbedded = (
        <EntryForm
          entryType={entryType}
          setEntryType={setEntryType}
          amount={amount}
          setAmount={setAmount}
          addQuickAmount={addQuickAmount}
          selectedCategoryId={selectedCategoryId}
          setSelectedCategoryId={setSelectedCategoryId}
          categoriesByType={categoriesByType}
          entryDate={entryDate}
          setEntryDate={setEntryDate}
          memo={memo}
          setMemo={setMemo}
          onSubmit={addEntry}
          dark={dark}
          inputClass={input}
          cardClass={card}
          wide={true}
          embedded={true}
        />
      );

      const calendarBlock = (
        <div className={`rounded-2xl border p-4 sm:p-6 ${card}`}>
          <h2 className="font-semibold text-lg mb-4">달력</h2>
          <CalendarGrid
            month={cursorMonth}
            entriesByDate={entriesByDate}
            categoryMap={categoryMap}
            onDateClick={setOpenDate}
            dark={dark}
            wide={!isMobileView}
          />
        </div>
      );

      const mobileAssetBudgetBlock = (
        <AssetBudgetSection
          monthData={monthData}
          setMonthData={setMonthData}
          monthIncome={monthIncome}
          monthExpense={monthExpense}
          categoriesByType={categoriesByType}
          currentStats={currentStats}
          monthDataBudgets={monthData.budgets}
          updateBudget={updateBudget}
          dark={dark}
          cardClass={card}
          inputClass={input}
          subtle={subtle}
          budgetCollapsible={true}
          budgetOpen={budgetOpen}
          onBudgetToggle={() => setBudgetOpen((v) => !v)}
          budgetSummary={budgetSummary}
          budgetCompact={false}
        />
      );

      const mobileHomeContent = (
        <div className="space-y-4">
          <MonthNav cursorMonth={cursorMonth} onPrev={goPrevMonth} onNext={goNextMonth} dark={dark} cardClass={card} />
          {mobileAssetBudgetBlock}
          {entryFormBlock}
          <CollapsiblePanel
            title="카테고리 커스텀"
            summary={categorySummary}
            open={categoryOpen}
            onToggle={() => setCategoryOpen((v) => !v)}
            dark={dark}
            cardClass={card}
          >
            {categoryManagerInner}
          </CollapsiblePanel>
          {calendarBlock}
          <DetailList
            entries={monthData.entries}
            categoryMap={categoryMap}
            dark={dark}
            cardClass={card}
            onEditEntry={openEntryEdit}
            onDeleteEntry={deleteEntry}
          />
          <DonutSection donutLabels={donutLabels} donutValues={donutValues} donutColors={donutColors} dark={dark} cardClass={card} />
        </div>
      );

      const inputContent = (
        <div className="space-y-5">
          <MonthNav cursorMonth={cursorMonth} onPrev={goPrevMonth} onNext={goNextMonth} dark={dark} cardClass={card} />
          {entryFormBlock}
        </div>
      );

      const analysisContent = (
        <div className="space-y-5">
          <MonthNav cursorMonth={cursorMonth} onPrev={goPrevMonth} onNext={goNextMonth} dark={dark} cardClass={card} />
          <AnalysisPanel
            trendRows={trendRows}
            entries={monthData.entries}
            categoryMap={categoryMap}
            donutLabels={donutLabels}
            donutValues={donutValues}
            donutColors={donutColors}
            dark={dark}
            cardClass={card}
            onEditEntry={openEntryEdit}
            onDeleteEntry={deleteEntry}
          />
        </div>
      );

      const activeTabContent = isMobileView
        ? (activeTab === "analysis" ? analysisContent : mobileHomeContent)
        : null;

      return (
        <div className={`${dark ? "bg-slate-950 text-slate-100" : "text-slate-900"} paper-bg min-h-screen ${contentPad}`}>
          <div className={`${shellClass} px-4 sm:px-6 py-4 sm:py-6`}>
            <header className="mb-4 sm:mb-6">
              <div className="flex items-center justify-between gap-2 mb-3">
                <h1 className="text-xl sm:text-3xl font-bold cozy-title">용돈 관리 앱</h1>
                <button onClick={() => setTheme(dark ? "light" : "dark")} className={`px-3 py-2 rounded-lg text-sm border ${card}`}>
                  {dark ? "라이트" : "다크"}
                </button>
              </div>

              <div className={`rounded-xl border p-1 flex gap-1 ${card}`}>
                <button
                  type="button"
                  onClick={() => setViewMode("mobile")}
                  className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-colors ${viewMode === "mobile" ? "bg-brand-blue text-white" : dark ? "text-slate-400" : "text-slate-600"}`}
                >
                  📱 모바일 보기
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode("desktop")}
                  className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-colors ${viewMode === "desktop" ? "bg-brand-blue text-white" : dark ? "text-slate-400" : "text-slate-600"}`}
                >
                  💻 PC 보기
                </button>
              </div>
            </header>

            <StatusBanner message={urgencyInfo.message} dark={dark} urgencyRatio={urgencyInfo.ratio} />

            {isMobileView ? activeTabContent : (
              <DesktopDashboard
                cursorMonth={cursorMonth}
                goPrevMonth={goPrevMonth}
                goNextMonth={goNextMonth}
                card={card}
                input={input}
                subtle={subtle}
                dark={dark}
                monthData={monthData}
                setMonthData={setMonthData}
                monthIncome={monthIncome}
                monthExpense={monthExpense}
                categoriesByType={categoriesByType}
                currentStats={currentStats}
                updateBudget={updateBudget}
                entryFormBlock={entryFormEmbedded}
                entriesByDate={entriesByDate}
                categoryMap={categoryMap}
                setOpenDate={setOpenDate}
                donutLabels={donutLabels}
                donutValues={donutValues}
                donutColors={donutColors}
                trendRows={trendRows}
                monthDataEntries={monthData.entries}
                categoryMapFull={categoryMap}
                categoryManagerBlock={categoryManagerInner}
                budgetPanelOpen={budgetPanelOpen}
                setBudgetPanelOpen={setBudgetPanelOpen}
                categoryPanelOpen={categoryPanelOpen}
                setCategoryPanelOpen={setCategoryPanelOpen}
                budgetSummary={budgetSummary}
                categorySummary={categorySummary}
              />
            )}

            <p className={`text-center text-xs mt-8 ${subtle}`}>저장 키: {APP_NAMESPACE}:YYYY-MM</p>
          </div>

          {isMobileView && (
            <TabBar activeTab={activeTab} onTabChange={setActiveTab} dark={dark} cardClass={card} variant="mobile" />
          )}

          <DateDetailModal
            openDate={openDate}
            entries={entriesByDate[openDate] || []}
            categories={monthData.categories}
            onClose={() => setOpenDate(null)}
            dark={dark}
            onEditEntry={openEntryEdit}
            onDeleteEntry={deleteEntry}
          />

          <EntryEditModal
            open={!!entryEditDraft}
            draft={entryEditDraft}
            categoriesByType={categoriesByType}
            dark={dark}
            inputClass={input}
            onChange={updateEntryDraft}
            onClose={() => setEntryEditDraft(null)}
            onSave={saveEntryEdit}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
