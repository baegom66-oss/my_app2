<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>용돈 관리 앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: { blue: "#2563EB", sky: "#DBEAFE" }
          },
          fontFamily: {
            sans: ["Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #f1f5f9; }
    body.dark { background: #020617; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const APP_NAMESPACE = "allowance-manager-v3";
    const LEGACY_KEY = "pocket-money-manager-v1";
    const QUICK_AMOUNTS = [5000, 10000, 50000, 100000];
    const COLOR_POOL = ["#EF4444", "#F97316", "#EAB308", "#22C55E", "#06B6D4", "#3B82F6", "#8B5CF6", "#EC4899", "#64748B"];

    const DEFAULT_EXPENSE_CATEGORIES = [
      { id: "exp-food", name: "식비", type: "expense", color: "#EF4444" },
      { id: "exp-transport", name: "교통", type: "expense", color: "#3B82F6" },
      { id: "exp-fun", name: "여가", type: "expense", color: "#EAB308" },
      { id: "exp-shopping", name: "쇼핑", type: "expense", color: "#EC4899" },
      { id: "exp-etc", name: "기타", type: "expense", color: "#64748B" }
    ];
    const DEFAULT_INCOME_CATEGORIES = [
      { id: "inc-allowance", name: "용돈", type: "income", color: "#22C55E" },
      { id: "inc-parttime", name: "알바", type: "income", color: "#06B6D4" },
      { id: "inc-bonus", name: "보너스", type: "income", color: "#8B5CF6" },
      { id: "inc-etc", name: "기타", type: "income", color: "#64748B" }
    ];

    const pad = (n) => String(n).padStart(2, "0");
    const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
    const isMonth = (v) => /^\d{4}-\d{2}$/.test(v || "");
    const nowMonth = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    };
    const formatKRW = (v) => new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 }).format(v || 0);
    const monthToLabel = (m) => `${m.slice(0, 4)}년 ${Number(m.slice(5, 7))}월`;
    const monthCompare = (a, b) => a.localeCompare(b);
    const shiftMonth = (m, diff) => {
      const [y, mm] = m.split("-").map(Number);
      const d = new Date(y, mm - 1 + diff, 1);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    };
    const toDateKey = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const MONTH_INDEX_KEY = `${APP_NAMESPACE}:month-index`;
    const monthStorageKey = (month) => `${APP_NAMESPACE}:${month}`;

    function createDefaultMonthData(month) {
      const categories = [...DEFAULT_EXPENSE_CATEGORIES, ...DEFAULT_INCOME_CATEGORIES];
      const budgets = {};
      categories.filter((c) => c.type === "expense").forEach((c) => {
        budgets[c.id] = 0;
      });
      return {
        version: 3,
        month,
        asset: 0,
        categories,
        budgets,
        entries: []
      };
    }

    function normalizeMonthData(month, raw) {
      const base = createDefaultMonthData(month);
      if (!raw || typeof raw !== "object") return base;

      const categories = Array.isArray(raw.categories)
        ? raw.categories
            .filter((c) => c && c.id && c.name && (c.type === "expense" || c.type === "income"))
            .map((c, idx) => ({
              id: String(c.id),
              name: String(c.name).trim(),
              type: c.type,
              color: /^#([A-Fa-f0-9]{6})$/.test(c.color || "") ? c.color : COLOR_POOL[idx % COLOR_POOL.length]
            }))
            .filter((c) => c.name.length > 0)
        : base.categories;

      const categoryMap = Object.fromEntries(categories.map((c) => [c.id, c]));
      const budgets = {};
      categories.filter((c) => c.type === "expense").forEach((c) => {
        const n = Math.floor(Number(raw.budgets?.[c.id]) || 0);
        budgets[c.id] = n > 0 ? n : 0;
      });

      const entries = Array.isArray(raw.entries)
        ? raw.entries
            .filter((e) => e && (e.type === "expense" || e.type === "income"))
            .map((e) => {
              const date = String(e.date || "").slice(0, 10);
              const entryMonth = date.slice(0, 7);
              if (!isMonth(entryMonth) || entryMonth !== month) return null;
              const type = e.type;
              let categoryId = String(e.categoryId || "");
              if (!categoryMap[categoryId] || categoryMap[categoryId].type !== type) {
                const fallback = categories.find((c) => c.type === type && c.name === "기타") || categories.find((c) => c.type === type);
                categoryId = fallback?.id || "";
              }
              const amount = Math.floor(Number(e.amount) || 0);
              if (!categoryId || amount <= 0) return null;
              return {
                id: String(e.id || uid()),
                type,
                categoryId,
                amount,
                date,
                memo: String(e.memo || "")
              };
            })
            .filter(Boolean)
        : [];

      return {
        version: 3,
        month,
        asset: Math.max(0, Math.floor(Number(raw.asset) || 0)),
        categories,
        budgets,
        entries
      };
    }

    function readMonthIndex() {
      try {
        const raw = JSON.parse(localStorage.getItem(MONTH_INDEX_KEY) || "[]");
        return Array.isArray(raw) ? raw.filter((m) => isMonth(m)).sort() : [];
      } catch {
        return [];
      }
    }

    function updateMonthIndex(month) {
      if (!isMonth(month)) return;
      const index = readMonthIndex();
      if (index.includes(month)) return;
      localStorage.setItem(MONTH_INDEX_KEY, JSON.stringify([...index, month].sort()));
    }

    function loadMonthData(month) {
      if (!isMonth(month)) return createDefaultMonthData(nowMonth());
      try {
        const raw = localStorage.getItem(monthStorageKey(month));
        return normalizeMonthData(month, raw ? JSON.parse(raw) : null);
      } catch {
        return createDefaultMonthData(month);
      }
    }

    function saveMonthData(month, data) {
      const normalized = normalizeMonthData(month, data);
      localStorage.setItem(monthStorageKey(month), JSON.stringify(normalized));
      updateMonthIndex(month);
    }

    function migrateLegacyIfNeeded() {
      const doneKey = `${APP_NAMESPACE}:legacy-migrated`;
      if (localStorage.getItem(doneKey) === "1") return;
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (!raw) {
          localStorage.setItem(doneKey, "1");
          return;
        }
        const legacy = JSON.parse(raw);
        const txs = Array.isArray(legacy.transactions) ? legacy.transactions : [];
        const bucket = {};

        txs.forEach((t) => {
          const date = String(t?.date || "").slice(0, 10);
          const month = date.slice(0, 7);
          const type = t?.type === "income" ? "income" : "expense";
          if (!isMonth(month) || !date) return;
          if (!bucket[month]) bucket[month] = loadMonthData(month);
          const data = bucket[month];

          let category = data.categories.find((c) => c.type === type && c.name === String(t?.category || "기타"));
          if (!category) {
            category = {
              id: `${type}-${uid()}`,
              name: String(t?.category || "기타"),
              type,
              color: COLOR_POOL[data.categories.length % COLOR_POOL.length]
            };
            data.categories.push(category);
            if (type === "expense") data.budgets[category.id] = 0;
          }

          const amount = Math.max(0, Math.floor(Number(t?.amount) || 0));
          if (amount <= 0) return;
          data.entries.push({
            id: String(t?.id || uid()),
            type,
            categoryId: category.id,
            amount,
            date,
            memo: String(t?.memo || "")
          });
        });

        Object.keys(bucket).forEach((m) => saveMonthData(m, bucket[m]));
      } catch {
      } finally {
        localStorage.setItem(doneKey, "1");
      }
    }

    function buildCalendarCells(month) {
      const [y, m] = month.split("-").map(Number);
      const first = new Date(y, m - 1, 1);
      const lastDate = new Date(y, m, 0).getDate();
      const leading = (first.getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < leading; i++) cells.push(null);
      for (let d = 1; d <= lastDate; d++) cells.push(`${y}-${pad(m)}-${pad(d)}`);
      return cells;
    }

    function DateDetailModal({ openDate, entries, categories, onClose, dark }) {
      if (!openDate) return null;
      const categoryMap = Object.fromEntries(categories.map((c) => [c.id, c]));
      const sorted = entries.slice().sort((a, b) => a.id < b.id ? 1 : -1);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 p-4 flex items-end sm:items-center justify-center" onClick={onClose}>
          <div className={`w-full max-w-xl rounded-2xl border p-5 ${dark ? "bg-slate-900 border-slate-700 text-slate-100" : "bg-white border-slate-100 text-slate-900"}`} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold">{openDate} 상세 내역</h3>
              <button onClick={onClose} className={`px-3 py-1 text-sm rounded-lg ${dark ? "bg-slate-800" : "bg-slate-100"}`}>닫기</button>
            </div>
            <div className="space-y-2 max-h-[70vh] overflow-y-auto">
              {sorted.length === 0 ? (
                <p className={`text-sm ${dark ? "text-slate-400" : "text-slate-500"}`}>선택한 날짜의 기록이 없습니다.</p>
              ) : sorted.map((e) => {
                const cat = categoryMap[e.categoryId];
                return (
                  <div key={e.id} className={`rounded-xl border p-3 ${dark ? "border-slate-700 bg-slate-800" : "border-slate-100 bg-slate-50/80"}`}>
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 text-sm">
                        <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: cat?.color || "#94A3B8" }} />
                        <strong>{cat?.name || "알 수 없는 카테고리"}</strong>
                        <span className={`text-[11px] px-2 py-0.5 rounded ${e.type === "expense" ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}>
                          {e.type === "expense" ? "지출" : "수입"}
                        </span>
                      </div>
                      <strong>{e.type === "expense" ? "-" : "+"}{formatKRW(e.amount)}</strong>
                    </div>
                    <p className={`mt-2 text-xs ${dark ? "text-slate-400" : "text-slate-500"}`}>{e.memo || "메모 없음"}</p>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      migrateLegacyIfNeeded();
      const currentMonth = nowMonth();
      const [cursorMonth, setCursorMonth] = useState(currentMonth);
      const [monthData, setMonthData] = useState(() => loadMonthData(currentMonth));
      const [theme, setTheme] = useState("light");
      const [entryType, setEntryType] = useState("expense");
      const [selectedCategoryId, setSelectedCategoryId] = useState("");
      const [amount, setAmount] = useState("");
      const [entryDate, setEntryDate] = useState(`${currentMonth}-01`);
      const [memo, setMemo] = useState("");
      const [newCategoryName, setNewCategoryName] = useState("");
      const [newCategoryType, setNewCategoryType] = useState("expense");
      const [newCategoryColor, setNewCategoryColor] = useState("#3B82F6");
      const [openDate, setOpenDate] = useState(null);
      const [navDirection, setNavDirection] = useState("init");

      const dark = theme === "dark";

      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
        document.body.classList.toggle("dark", dark);
      }, [dark]);

      useEffect(() => {
        const loaded = loadMonthData(cursorMonth);
        setMonthData(loaded);
        setEntryDate(`${cursorMonth}-01`);
        setOpenDate(null);
      }, [cursorMonth]);

      useEffect(() => {
        saveMonthData(cursorMonth, monthData);
      }, [cursorMonth, monthData]);

      const categoryMap = useMemo(
        () => Object.fromEntries(monthData.categories.map((c) => [c.id, c])),
        [monthData.categories]
      );
      const categoriesByType = useMemo(
        () => ({
          expense: monthData.categories.filter((c) => c.type === "expense"),
          income: monthData.categories.filter((c) => c.type === "income")
        }),
        [monthData.categories]
      );

      useEffect(() => {
        const list = categoriesByType[entryType];
        if (!list.length) {
          setSelectedCategoryId("");
          return;
        }
        if (!list.find((cat) => cat.id === selectedCategoryId)) {
          setSelectedCategoryId(list[0].id);
        }
      }, [entryType, categoriesByType, selectedCategoryId]);

      const entriesByDate = useMemo(() => {
        const map = {};
        monthData.entries.forEach((e) => {
          if (!map[e.date]) map[e.date] = [];
          map[e.date].push(e);
        });
        return map;
      }, [monthData.entries]);

      const monthIncome = useMemo(
        () => monthData.entries.filter((e) => e.type === "income").reduce((sum, e) => sum + e.amount, 0),
        [monthData.entries]
      );
      const monthExpense = useMemo(
        () => monthData.entries.filter((e) => e.type === "expense").reduce((sum, e) => sum + e.amount, 0),
        [monthData.entries]
      );
      const expenseByCategory = useMemo(() => {
        const map = {};
        monthData.entries.forEach((e) => {
          if (e.type !== "expense") return;
          map[e.categoryId] = (map[e.categoryId] || 0) + e.amount;
        });
        return map;
      }, [monthData.entries]);

      const budgetReportRows = categoriesByType.expense.map((cat) => {
        const budget = monthData.budgets[cat.id] || 0;
        const spent = expenseByCategory[cat.id] || 0;
        return { ...cat, budget, spent, status: spent <= budget ? "성공" : "초과" };
      });
      const showPastMonthReport = navDirection === "prev" && monthCompare(cursorMonth, currentMonth) < 0;

      const addEntry = (ev) => {
        ev.preventDefault();
        const n = Number(String(amount).replace(/[^\d]/g, ""));
        if (!n || !selectedCategoryId) return;
        if (!entryDate.startsWith(cursorMonth)) return;
        setMonthData((prev) => ({
          ...prev,
          entries: [{ id: uid(), type: entryType, categoryId: selectedCategoryId, amount: n, date: entryDate, memo: memo.trim() }, ...prev.entries]
        }));
        setAmount("");
        setMemo("");
      };

      const addQuickAmount = (plus) => {
        const base = Number(String(amount).replace(/[^\d]/g, "")) || 0;
        setAmount(String(base + plus));
      };

      const addCategory = () => {
        const cleanName = newCategoryName.trim();
        if (!cleanName) return;
        const duplicated = monthData.categories.some((c) => c.type === newCategoryType && c.name === cleanName);
        if (duplicated) return;
        const nextCat = { id: `${newCategoryType}-${uid()}`, name: cleanName, type: newCategoryType, color: newCategoryColor };
        setMonthData((prev) => {
          const next = {
            ...prev,
            categories: [...prev.categories, nextCat],
            budgets: { ...prev.budgets }
          };
          if (nextCat.type === "expense") next.budgets[nextCat.id] = 0;
          return next;
        });
        setNewCategoryName("");
        if (newCategoryType === entryType) setSelectedCategoryId(nextCat.id);
      };

      const deleteCategory = (catId) => {
        const target = monthData.categories.find((c) => c.id === catId);
        if (!target) return;
        const sameType = monthData.categories.filter((c) => c.type === target.type);
        if (sameType.length <= 1) return;
        const fallback = sameType.find((c) => c.id !== catId);
        setMonthData((prev) => {
          const nextEntries = prev.entries.map((e) => (e.categoryId === catId ? { ...e, categoryId: fallback.id } : e));
          const nextCategories = prev.categories.filter((c) => c.id !== catId);
          const nextBudgets = { ...prev.budgets };
          delete nextBudgets[catId];
          return { ...prev, categories: nextCategories, budgets: nextBudgets, entries: nextEntries };
        });
      };

      const updateCategoryColor = (catId, color) => {
        setMonthData((prev) => ({
          ...prev,
          categories: prev.categories.map((c) => (c.id === catId ? { ...c, color } : c))
        }));
      };

      const updateBudget = (catId, value) => {
        const n = Math.max(0, Math.floor(Number(value) || 0));
        setMonthData((prev) => ({
          ...prev,
          budgets: { ...prev.budgets, [catId]: n }
        }));
      };

      const card = dark ? "bg-slate-900 border-slate-800 text-slate-100" : "bg-white border-slate-100 text-slate-900";
      const input = dark ? "bg-slate-800 border-slate-700 text-slate-100" : "bg-white border-slate-200 text-slate-900";
      const subtle = dark ? "text-slate-400" : "text-slate-500";

      return (
        <div className={`${dark ? "bg-slate-950 text-slate-100" : "text-slate-900"} min-h-screen pb-10`}>
          <div className="max-w-7xl mx-auto px-4 py-6">
            <header className="mb-5 flex items-center justify-between gap-3">
              <div>
                <h1 className="text-2xl sm:text-3xl font-bold">용돈 관리 앱</h1>
                <p className={`text-sm mt-1 ${subtle}`}>월별(YYYY-MM) 로컬 저장 / 카테고리 컬러 / 예산 리포트 / 확장 캘린더</p>
              </div>
              <button onClick={() => setTheme(dark ? "light" : "dark")} className={`rounded-xl px-3 py-2 text-sm border ${card}`}>
                {dark ? "라이트 모드" : "다크 모드"}
              </button>
            </header>

            <section className={`rounded-2xl border p-3 sm:p-4 mb-4 flex items-center justify-between ${card}`}>
              <button onClick={() => { setCursorMonth(shiftMonth(cursorMonth, -1)); setNavDirection("prev"); }} className="px-3 py-2 rounded-lg bg-brand-blue text-white text-sm font-semibold">이전 달</button>
              <strong className="text-base sm:text-xl">{monthToLabel(cursorMonth)}</strong>
              <button onClick={() => { setCursorMonth(shiftMonth(cursorMonth, 1)); setNavDirection("next"); }} className="px-3 py-2 rounded-lg bg-brand-blue text-white text-sm font-semibold">다음 달</button>
            </section>

            <div className="grid grid-cols-1 xl:grid-cols-5 gap-4">
              <section className="xl:col-span-2 space-y-4">
                <div className={`rounded-2xl border p-4 ${card}`}>
                  <h2 className="font-semibold mb-3">자산 및 카테고리 예산 설정</h2>
                  <label className={`text-xs block mb-1 ${subtle}`}>현재 보유 자산</label>
                  <input
                    type="number"
                    value={monthData.asset || ""}
                    onChange={(e) => setMonthData((prev) => ({ ...prev, asset: Math.max(0, Number(e.target.value) || 0) }))}
                    className={`w-full rounded-xl border px-3 py-2 mb-3 ${input}`}
                  />
                  <div className="text-sm space-y-1 mb-4">
                    <p>이번 달 수입: <strong className="text-emerald-500">{formatKRW(monthIncome)}</strong></p>
                    <p>이번 달 지출: <strong className="text-red-500">{formatKRW(monthExpense)}</strong></p>
                    <p>잔여 자산: <strong>{formatKRW(monthData.asset + monthIncome - monthExpense)}</strong></p>
                  </div>
                  <div className="space-y-2">
                    {categoriesByType.expense.map((cat) => (
                      <div key={cat.id}>
                        <label className="text-xs mb-1 flex items-center gap-2">
                          <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cat.color }} />
                          {cat.name} 예산 상한
                        </label>
                        <input
                          type="number"
                          value={monthData.budgets[cat.id] || ""}
                          onChange={(e) => updateBudget(cat.id, e.target.value)}
                          className={`w-full rounded-xl border px-3 py-2 ${input}`}
                        />
                      </div>
                    ))}
                  </div>
                </div>

                <form onSubmit={addEntry} className={`rounded-2xl border p-4 ${card}`}>
                  <h2 className="font-semibold mb-3">수입 / 지출 입력</h2>
                  <div className="grid grid-cols-2 gap-2 mb-3">
                    <button type="button" onClick={() => setEntryType("expense")} className={`py-2 rounded-xl font-semibold ${entryType === "expense" ? "bg-red-500 text-white" : dark ? "bg-slate-800" : "bg-slate-100"}`}>지출</button>
                    <button type="button" onClick={() => setEntryType("income")} className={`py-2 rounded-xl font-semibold ${entryType === "income" ? "bg-emerald-500 text-white" : dark ? "bg-slate-800" : "bg-slate-100"}`}>수입</button>
                  </div>
                  <label className={`text-xs block mb-1 ${subtle}`}>금액</label>
                  <input type="text" inputMode="numeric" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^\d]/g, ""))} className={`w-full rounded-xl border px-3 py-3 text-xl font-bold ${input}`} />
                  <div className="grid grid-cols-2 gap-3 mt-3 mb-3">
                    {QUICK_AMOUNTS.map((v) => (
                      <button key={v} type="button" onClick={() => addQuickAmount(v)} className="py-4 rounded-xl text-lg font-bold bg-brand-blue text-white">
                        +{v >= 10000 ? `${v / 10000}만` : `${v / 1000}천`}
                      </button>
                    ))}
                  </div>
                  <label className={`text-xs block mb-1 ${subtle}`}>카테고리</label>
                  <select value={selectedCategoryId} onChange={(e) => setSelectedCategoryId(e.target.value)} className={`w-full rounded-xl border px-3 py-2 mb-3 ${input}`}>
                    {(categoriesByType[entryType] || []).map((cat) => (
                      <option key={cat.id} value={cat.id}>{cat.name}</option>
                    ))}
                  </select>
                  <label className={`text-xs block mb-1 ${subtle}`}>날짜</label>
                  <input type="date" value={entryDate} onChange={(e) => setEntryDate(e.target.value)} className={`w-full rounded-xl border px-3 py-2 mb-3 ${input}`} />
                  <label className={`text-xs block mb-1 ${subtle}`}>메모</label>
                  <input type="text" value={memo} onChange={(e) => setMemo(e.target.value)} className={`w-full rounded-xl border px-3 py-2 mb-3 ${input}`} />
                  <button type="submit" className="w-full py-3 rounded-xl bg-slate-900 text-white font-semibold">기록 저장</button>
                </form>

                <div className={`rounded-2xl border p-4 ${card}`}>
                  <h2 className="font-semibold mb-3">카테고리 커스텀 설정</h2>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <select value={newCategoryType} onChange={(e) => setNewCategoryType(e.target.value)} className={`rounded-xl border px-3 py-2 ${input}`}>
                      <option value="expense">지출</option>
                      <option value="income">수입</option>
                    </select>
                    <input type="color" value={newCategoryColor} onChange={(e) => setNewCategoryColor(e.target.value)} className="h-10 rounded-xl border px-1" />
                  </div>
                  <div className="flex gap-2 mb-3">
                    <input type="text" value={newCategoryName} onChange={(e) => setNewCategoryName(e.target.value)} placeholder="카테고리 이름 입력" className={`flex-1 rounded-xl border px-3 py-2 ${input}`} />
                    <button type="button" onClick={addCategory} className="px-4 rounded-xl bg-brand-blue text-white font-semibold">추가</button>
                  </div>
                  <div className="space-y-2 max-h-64 overflow-y-auto">
                    {monthData.categories.map((cat) => (
                      <div key={cat.id} className={`rounded-xl border p-2 ${dark ? "border-slate-700" : "border-slate-200"}`}>
                        <div className="flex items-center gap-2 mb-2">
                          <span className={`text-xs px-2 py-0.5 rounded ${cat.type === "expense" ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}>
                            {cat.type === "expense" ? "지출" : "수입"}
                          </span>
                          <span className="text-sm font-semibold">{cat.name}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <input type="color" value={cat.color} onChange={(e) => updateCategoryColor(cat.id, e.target.value)} className="h-8 w-12 rounded border" />
                          <button type="button" onClick={() => deleteCategory(cat.id)} className="ml-auto px-3 py-1 rounded-lg bg-red-500 text-white text-sm">삭제</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <section className={`xl:col-span-3 rounded-2xl border p-4 ${card}`}>
                <h2 className="font-semibold mb-3">캘린더</h2>
                <div className="grid grid-cols-7 gap-2 text-center text-xs font-semibold mb-2">
                  {["월", "화", "수", "목", "금", "토", "일"].map((day) => (
                    <div key={day} className={subtle}>{day}</div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {buildCalendarCells(cursorMonth).map((d, idx) => {
                    if (!d) {
                      return <div key={`blank-${idx}`} className={`min-h-[150px] rounded-xl ${dark ? "bg-slate-900/30" : "bg-slate-100/50"}`} />;
                    }
                    const list = entriesByDate[d] || [];
                    const expenseCategoryDots = [...new Set(
                      list
                        .filter((e) => e.type === "expense")
                        .map((e) => categoryMap[e.categoryId]?.color || "#94A3B8")
                    )];
                    return (
                      <button key={d} type="button" onClick={() => setOpenDate(d)} className={`min-h-[150px] rounded-xl border p-2 text-left flex flex-col ${dark ? "border-slate-700 hover:bg-slate-800" : "border-slate-200 hover:bg-brand-sky/50"}`}>
                        <div className="text-sm font-bold">{Number(d.slice(-2))}</div>
                        <div className="mt-2 flex flex-wrap gap-1.5">
                          {expenseCategoryDots.map((color, colorIdx) => (
                            <span key={`${d}-${colorIdx}`} className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color }} />
                          ))}
                        </div>
                        <div className={`mt-auto text-[11px] ${subtle}`}>{list.length > 0 ? `${list.length}건` : ""}</div>
                      </button>
                    );
                  })}
                </div>
              </section>
            </div>

            {showPastMonthReport && (
              <section className={`rounded-2xl border p-4 mt-4 ${card}`}>
                <h2 className="font-semibold mb-2">{monthToLabel(cursorMonth)} 예산 리포트</h2>
                <p className={`text-xs mb-3 ${subtle}`}>이전 달로 이동했을 때 해당 월의 카테고리별 예산과 실제 지출을 비교합니다.</p>
                <div className="space-y-2">
                  {budgetReportRows.map((row) => (
                    <div key={row.id} className={`rounded-xl border p-3 ${dark ? "border-slate-700 bg-slate-800" : "border-slate-100 bg-slate-50/80"}`}>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 text-sm">
                          <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ backgroundColor: row.color }} />
                          <strong>{row.name}</strong>
                        </div>
                        <span className={`text-xs px-2 py-1 rounded ${row.status === "성공" ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}`}>
                          {row.status}
                        </span>
                      </div>
                      <p className={`text-xs mt-1 ${subtle}`}>예산 {formatKRW(row.budget)} / 실제 지출 {formatKRW(row.spent)}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            <p className={`text-center text-xs mt-6 ${subtle}`}>저장 키 형식: {APP_NAMESPACE}:YYYY-MM (월별 분리 저장)</p>
          </div>

          <DateDetailModal
            openDate={openDate}
            entries={entriesByDate[openDate] || []}
            categories={monthData.categories}
            onClose={() => setOpenDate(null)}
            dark={dark}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
